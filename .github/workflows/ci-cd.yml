name: CampusCore CI

on:
  push:
    branches:
      - main
      - devops-pipeline
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Build Spring Boot Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: schoolsync2
          MYSQL_ROOT_PASSWORD: warrior@27
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pwarrior@27"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/schoolsync2
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: warrior@27

      SPRING_MAIL_USERNAME: dummy@example.com
      SPRING_MAIL_PASSWORD: dummy

      APP_MAIL_SENDER_NAME: CampusCore CI
      APP_MAIL_SENDER_EMAIL: dummy@example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build and Test Backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

  ai-service:
    name: Validate FastAPI AI Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python Files
        run: python -m compileall app training

      - name: Verify FastAPI App
        run: python -c "from app.main import app; print(app.title)"

      - name: Verify Trained Model Exists
        run: test -f models/student_risk_model.pkl