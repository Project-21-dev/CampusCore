name: CampusCore CI

on:
  push:
    branches:
      - main
      - devops-pipeline
      - chinmay-admission-faceatendance-fix

  pull_request:
    branches:
      - main
      - devops-pipeline

permissions:
  contents: read

jobs:
  backend:
    name: Build and Test Spring Boot Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: schoolsync2
          MYSQL_ROOT_PASSWORD: campuscore_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcampuscore_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/schoolsync2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: campuscore_ci_password

      # Dummy mail values are enough for build and test.
      # Do not put your real Gmail address or app password here.
      SPRING_MAIL_USERNAME: dummy@example.com
      SPRING_MAIL_PASSWORD: dummy-app-password

      APP_MAIL_SENDER_NAME: CampusCore CI
      APP_MAIL_SENDER_EMAIL: dummy@example.com

      # CI-only values. Do not use real production secrets here.
      APP_JWT_SECRET: CampusCoreCiOnlyJwtSecretKey1234567890ABCDEF
      AI_SERVICE_API_KEY: campuscore-ci-ai-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  ai-service:
    name: Validate FastAPI AI Service
    runs-on: ubuntu-latest

    env:
      AI_SERVICE_API_KEY: campuscore-ci-ai-key

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Remove conflicting OpenCV packages
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y cv2 opencv-python opencv-python-headless opencv-contrib-python || true

      - name: Install AI dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify OpenCV
        run: |
          python -c "import cv2; print('OpenCV:', cv2.__version__); assert hasattr(cv2, 'CascadeClassifier'), 'CascadeClassifier missing'; print('CascadeClassifier: OK')"

      - name: Compile Python files
        run: python -m compileall app training

      - name: Verify FastAPI app
        run: python -c "from app.main import app; print('FastAPI application:', app.title)"

      - name: Verify trained model exists
        run: test -f models/student_risk_model.pkl

      - name: Verify Random Forest prediction
        run: |
          python - <<'PY'
          import joblib

          model = joblib.load('models/student_risk_model.pkl')
          sample = [[85.0, 78.0, 3, 0, 1.0]]

          prediction = model.predict(sample)
          probabilities = model.predict_proba(sample)

          print('Random Forest prediction:', prediction[0])
          print('Prediction probabilities:', probabilities[0])
          print('Model classes:', model.classes_)
          PY