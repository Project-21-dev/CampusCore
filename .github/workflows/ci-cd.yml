name: CampusCore CI

on:
  push:
    branches:
      - main
      - devops-pipeline
      - chinmay-admission-faceatendance-fix

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ============================================================
  # SPRING BOOT BACKEND
  # ============================================================
  backend:
    name: Build Spring Boot Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: schoolsync2
          MYSQL_ROOT_PASSWORD: campuscore_ci_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcampuscore_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/schoolsync2
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: campuscore_ci_password

      SPRING_MAIL_USERNAME: dummy@example.com
      SPRING_MAIL_PASSWORD: dummy

      APP_MAIL_SENDER_NAME: CampusCore CI
      APP_MAIL_SENDER_EMAIL: dummy@example.com

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build and Test Backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify


  # ============================================================
  # REACT FRONTEND
  # ============================================================
  frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build


  # ============================================================
  # FASTAPI AI SERVICE
  # ============================================================
  ai-service:
    name: Validate FastAPI AI Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      # Remove conflicting OpenCV packages first.
      # CampusCore face attendance should use only
      # opencv-python-headless.
      - name: Remove Conflicting OpenCV Packages
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y cv2 opencv-python opencv-python-headless opencv-contrib-python || true

      - name: Install AI Dependencies
        run: python -m pip install -r requirements.txt

      # Make CI fail here with a clear message if the wrong
      # OpenCV package is ever installed again.
      - name: Verify OpenCV Installation
        run: |
          python -c "import cv2; print('OpenCV version:', cv2.__version__); print('OpenCV path:', cv2.__file__); assert hasattr(cv2, 'CascadeClassifier'), 'CascadeClassifier is missing from OpenCV'; print('CascadeClassifier: OK')"

      - name: Compile Python Files
        run: python -m compileall app training

      - name: Verify FastAPI App
        run: |
          python -c "from app.main import app; print('FastAPI application:', app.title)"

      - name: Verify Face Attendance Module
        run: |
          python -c "from app.face_service import enroll_student, enrollment_status, verify_student; print('Face attendance module: OK')"

      - name: Verify Trained Model Exists
        run: test -f models/student_risk_model.pkl

      - name: Verify Random Forest Prediction
        run: |
          python - <<'PY'
          import joblib

          model = joblib.load("models/student_risk_model.pkl")

          sample = [[
              85.0,
              78.0,
              3,
              0,
              1.0
          ]]

          prediction = model.predict(sample)
          probabilities = model.predict_proba(sample)

          print("Random Forest prediction:", prediction[0])
          print("Prediction probabilities:", probabilities[0])
          print("Model classes:", model.classes_)
          PY